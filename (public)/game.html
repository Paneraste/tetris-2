<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Neon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="icone.ico" type="x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="description" content="Jogue o clássico Tetris com visual Neon Cyberpunk. Projeto desenvolvido por alunos da UCP. Salve seu recorde no ranking global!">
    <meta name="keywords" content="Tetris, Game, UCP, Neon, Cyberpunk, JavaScript, Firebase">
    <meta name="author" content="Arthur Vinagre e Pedro Prado">
    <meta name="theme-color" content="#050505">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tetris2-ucp.web.app/">
    <meta property="og:title" content="Tetris Neon | Projeto UCP">
    <meta property="og:description" content="Desafie a gravidade e a velocidade neste Tetris futurista! Jogue agora e tente entrar no Top 3.">
    <meta property="og:image" content="https://tetris2-ucp.web.app/icone.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Tetris Neon | Projeto UCP">
    <meta name="twitter:description" content="Jogue o clássico Tetris com visual Neon Cyberpunk. Tente bater o recorde!">
    <meta name="twitter:image" content="https://tetris2-ucp.web.app/icone.png">
</head>
<body>
    
    <div id="particle-background"></div>
    <div id="speed-toast">Velocidade Aumentou!</div>
    <div class="main-container">
        <header class="game-header">
            <img src="logo.gif" alt="Tetris UCP" id="logo">
        </header>

        <div class="game-wrapper">
            
            <aside class="panel left-panel glass-panel">
                <div class="score-box">
                    <h3>PONTUAÇÃO</h3>
                    <p id="pontuacao">0</p>
                </div>
                <div class="status-box">
                    <button id="btnpause" class="neon-btn">PAUSAR</button>
                    <a href="about.html" class="neon-link">Sobre</a>
                </div>
            </aside>

            <main class="canvas-container glass-panel">
                <canvas id="game-board"></canvas>
                
                <div id="name-input-container" class="overlay hidden">
                    <div class="overlay-content">
                        <h2>NOVO RECORDE!</h2>
                        <input type="text" id="player-name" placeholder="Digite seu nome" maxlength="10">
                        <button id="save-name" class="neon-btn">SALVAR</button>
                    </div>
                </div>
            </main>

            <aside class="panel right-panel glass-panel">
    
    <div class="next-box">
        <h3>PRÓXIMA</h3>
        <div class="next-canvas-container">
            <canvas id="next-board" width="120" height="120"></canvas>
        </div>
    </div>
    <div class="record-box">
    <h3>TOP 5 GLOBAL</h3>
    <div id="record-table"></div>
</div>
    </aside>
        </div>

        <div class="mobile-controls">
            <div class="d-pad">
                <button id="btnesq" class="ctrl-btn"><i class="fas fa-undo"></i></button>
                <button id="btndir" class="ctrl-btn"><i class="fas fa-redo"></i></button>
            </div>
            <div class="move-pad">
                <button id="btnleft" class="ctrl-btn"><i class="fas fa-arrow-left"></i></button>
                <button id="btndown" class="ctrl-btn"><i class="fas fa-arrow-down"></i></button>
                <button id="btnright" class="ctrl-btn"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <audio id="background-music" src="01.mp3" loop></audio>
    <audio id="line-clear-sound" src="clear-line.mp3" preload="auto"></audio>

    <script type="module" src="tetris.js"></script>
</body>
</html>
